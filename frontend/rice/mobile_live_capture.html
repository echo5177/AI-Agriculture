<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mobile Live Capture PoC</title>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Outfit', 'Inter', sans-serif; background: #fcf5e5; color: #332b21; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 14px; }
    .card { background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(51, 43, 33, 0.1); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 16px rgba(51, 43, 33, 0.05); backdrop-filter: blur(8px); }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 13px; font-weight: 600; }
    input, button { border-radius: 8px; border: 1px solid rgba(51, 43, 33, 0.2); background: rgba(255, 255, 255, 0.8); color: #332b21; padding: 8px 12px; font-family: inherit; font-size: 13px; transition: all 0.2s; }
    input:focus { outline: none; border-color: #059669; box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1); }
    input { min-width: 120px; }
    button { cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    button:hover { background: #fcf5e5; }
    button.primary { background: #059669; border-color: #047857; color: white; }
    button.primary:hover { background: #047857; }
    button.warn { background: #e11d48; border-color: #be123c; color: white; }
    button.warn:hover { background: #be123c; }
    #preview { width: 100%; max-height: 55vh; background: #1e293b; border-radius: 8px; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
    #log { white-space: pre-wrap; font-size: 12px; line-height: 1.4; background: rgba(51, 43, 33, 0.05); border: 1px solid rgba(51, 43, 33, 0.1); border-radius: 8px; padding: 12px; min-height: 120px; max-height: 260px; overflow: auto; font-family: monospace; }
    .muted { opacity: 0.7; font-size: 12px; font-weight: 400; }
    label { display: flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h3 style="margin: 0 0 8px 0; color: #332b21;"><i class="fa fa-video-camera" style="color: #8b5cf6; margin-right: 8px;"></i><span data-i18n="mobile_live_poc">Live Camera PoC</span></h3>
      <div class="muted" data-i18n="mobile_live_poc_desc">Open real-time camera frame upload page</div>
    </div>

    <div class="card">
      <div class="row">
        <label>Device ID <input id="deviceId" /></label>
        <label>Location <input id="location" value="mobile_live" /></label>
        <label>Crop Type <input id="cropType" value="rice" /></label>
      </div>
      <div class="row">
        <label>Note <input id="farmNote" value="live-camera" style="min-width: 180px;" /></label>
        <label>Interval(s) <input id="intervalSec" type="number" min="0.2" step="0.1" value="2.0" style="width: 70px;" /></label>
        <label>Endpoint <input id="endpoint" value="/api/v1/image/upload" style="min-width: 200px;" /></label>
      </div>
      <div class="row" style="margin-top: 16px;">
        <button id="startCam" class="primary"><i class="fa fa-camera"></i> <span data-i18n="live_shoot">Live Capture</span></button>
        <button id="startLoop" class="primary"><i class="fa fa-refresh"></i> <span data-i18n="start_loop_capture">Start Loop Capture</span></button>
        <button id="stopLoop" class="warn"><i class="fa fa-stop"></i> <span data-i18n="mobile_clear">Clear</span></button>
        <span id="stats" class="muted" style="margin-left: auto; font-family: monospace; font-weight: bold;">sent=0 ok=0 fail=0</span>
      </div>
    </div>

    <div class="card" style="padding: 8px;">
      <video id="preview" autoplay muted playsinline></video>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div class="card">
      <div id="log"></div>
    </div>
  </div>

  <script src="i18n.js?v=1.1"></script>
  <script>
    const q = new URLSearchParams(location.search);
    const $ = (id) => document.getElementById(id);
    const state = { stream: null, timer: null, sent: 0, ok: 0, fail: 0 };
    $("deviceId").value = q.get("device_id") || "dev_mobile_live_01";
    if (q.get("endpoint")) $("endpoint").value = q.get("endpoint");

    function log(msg) {
      const el = $("log");
      el.textContent += `[${new Date().toISOString()}] ${msg}\n`;
      el.scrollTop = el.scrollHeight;
    }
    function refreshStats() {
      $("stats").textContent = `sent=${state.sent} ok=${state.ok} fail=${state.fail}`;
    }
    async function startCamera() {
      if (state.stream) return;
      try {
        state.stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        $("preview").srcObject = state.stream;
        log("camera started");
      } catch (e) {
        log("camera failed: " + e.message);
      }
    }
    function stopLoop() {
      if (state.timer) clearInterval(state.timer);
      state.timer = null;
      log("loop stopped");
    }
    async function uploadOnce() {
      const video = $("preview");
      if (!video.videoWidth || !video.videoHeight) {
        log("skip: no video frame yet");
        return;
      }
      const intervalSec = Math.max(0.2, Number($("intervalSec").value || 2.0));
      const endpoint = $("endpoint").value.trim();
      const deviceId = $("deviceId").value.trim();
      const locationVal = $("location").value.trim();
      const cropType = $("cropType").value.trim();
      const farmNote = $("farmNote").value.trim();
      const canvas = $("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0);
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.86));
      if (!blob) {
        log("capture failed: canvas blob null");
        return;
      }
      const ts = new Date().toISOString();
      const qs = new URLSearchParams({
        device_id: deviceId,
        ts,
        location: locationVal,
        crop_type: cropType,
        farm_note: farmNote,
        capture_mode: 'manual'
      });
      const form = new FormData();
      form.append("file", blob, `live_${Date.now()}.jpg`);
      const url = endpoint.includes("?") ? `${endpoint}&${qs}` : `${endpoint}?${qs}`;
      const t0 = performance.now();
      state.sent += 1;
      refreshStats();
      try {
        const resp = await fetch(url, { method: "POST", body: form });
        const txt = await resp.text();
        const ms = (performance.now() - t0).toFixed(1);
        if (resp.ok && txt.includes("\"status\":\"success\"")) {
          state.ok += 1;
          log(`ok ${ms}ms ${txt.slice(0, 180)}`);
        } else {
          state.fail += 1;
          log(`fail ${ms}ms status=${resp.status} body=${txt.slice(0, 180)}`);
        }
      } catch (e) {
        state.fail += 1;
        log(`fail network ${e.message}`);
      }
      refreshStats();
      if (state.timer) {
        const nowInterval = Math.max(0.2, Number($("intervalSec").value || 2.0));
        if (Math.abs(nowInterval - intervalSec) > 1e-6) {
          clearInterval(state.timer);
          state.timer = setInterval(uploadOnce, nowInterval * 1000);
          log(`interval hot-update -> ${nowInterval}s`);
        }
      }
    }
    async function startLoop() {
      await startCamera();
      stopLoop();
      const sec = Math.max(0.2, Number($("intervalSec").value || 2.0));
      state.timer = setInterval(uploadOnce, sec * 1000);
      log("loop started interval=" + sec + "s");
      uploadOnce();
    }

    $("startCam").addEventListener("click", startCamera);
    $("startLoop").addEventListener("click", startLoop);
    $("stopLoop").addEventListener("click", stopLoop);
    window.addEventListener("beforeunload", () => {
      stopLoop();
      if (state.stream) {
        for (const t of state.stream.getTracks()) t.stop();
      }
    });
  </script>
</body>
</html>
