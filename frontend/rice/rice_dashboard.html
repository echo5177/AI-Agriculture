<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Farm AI-Inference</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { 
            emerald: { 400: '#34d399', 500: '#059669', 600: '#065f46' }, 
            dark: '#fcf5e5', 
            panel: 'rgba(255, 255, 255, 0.7)' 
          },
          fontFamily: { sans: ['Outfit', 'Inter', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-[#fcf5e5] text-[#332b21] min-h-screen relative overflow-x-hidden font-sans pb-10">
  <!-- Ambient glowing backgrounds -->
  <div class="fixed inset-0 z-0 pointer-events-none">
      <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-emerald-500/10 rounded-full blur-[140px]"></div>
      <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-orange-500/5 rounded-full blur-[140px]"></div>
  </div>

  <div id="main-content" class="min-h-screen">
      <!-- Floating Controls -->
      <div class="fixed top-4 right-4 md:right-8 z-50 glass-panel flex items-center gap-4 px-4 py-2 shadow-lg">
          <div class="hidden md:flex flex-col items-end">
              <span id="clock" class="text-xs text-[#332b21]/60 font-mono">00:00:00</span>
          </div>
          <div class="relative group cursor-pointer">
              <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#332b21]/5 border border-[#332b21]/10 hover:bg-[#332b21]/10 transition-colors">
                  <i class="fa fa-globe text-emerald-700 text-sm"></i>
                  <span class="text-xs font-bold text-[#332b21]/80 uppercase" id="currentLangDisplay">ZH</span>
                  <i class="fa fa-chevron-down text-[8px] text-[#332b21]/40"></i>
              </div>
              <div class="absolute right-0 top-full mt-2 w-32 bg-[#fcf5e5] border border-[#332b21]/10 rounded-xl shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all transform origin-top-right z-50">
                  <div class="p-1.5 flex flex-col gap-1">
                      <button onclick="window.I18N.setLanguage('zh'); document.getElementById('currentLangDisplay').textContent='ZH'" class="text-left w-full px-3 py-2 text-xs text-[#332b21]/80 hover:text-emerald-700 hover:bg-[#332b21]/5 rounded-lg transition-colors font-medium">ZH - 中文</button>
                      <button onclick="window.I18N.setLanguage('en'); document.getElementById('currentLangDisplay').textContent='EN'" class="text-left w-full px-3 py-2 text-xs text-[#332b21]/80 hover:text-emerald-700 hover:bg-[#332b21]/5 rounded-lg transition-colors font-medium">EN - English</button>
                      <button onclick="window.I18N.setLanguage('ms'); document.getElementById('currentLangDisplay').textContent='MS'" class="text-left w-full px-3 py-2 text-xs text-[#332b21]/80 hover:text-emerald-700 hover:bg-[#332b21]/5 rounded-lg transition-colors font-medium">MS - Melayu</button>
                  </div>
              </div>
          </div>
      </div>

      <!-- Static Branding -->
      <header class="mx-4 md:mx-8 pt-8 pb-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div class="flex items-center gap-4">
              <h1 class="text-2xl font-bold text-[#332b21] tracking-wide">Smart Farm <span class="text-emerald-700 font-light">AI-Inference</span></h1>
              <p class="text-xs text-[#332b21]/50"><i class="fa fa-circle text-emerald-600 animate-pulse text-[8px] mr-1"></i><span data-i18n="sys_running">推理引擎就绪</span></p>
          </div>
      </header>
          <!-- VIEW: Home (Dashboard) -->
          <section id="view-home" class="view-section active p-4 md:p-8">
              <div class="dashboard-layout">
                  <!-- LEFT PANEL REMOVED -->

                  <!-- RIGHT: Telemetry & Vision Board -->
                  <div class="dashboard-right space-y-8">

                      <!-- Gateway Visuals -->
                      <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                           <div class="glass-panel p-6">
                               <h2 class="text-sm font-bold text-[#332b21] mb-4 flex items-center gap-2 uppercase tracking-widest"><i class="fa fa-camera text-blue-600"></i><span data-i18n="mobile_upload_title">图传上传</span></h2>
                               <p class="text-[11px] text-[#332b21]/60 mb-4" data-i18n="mobile_upload_desc">Real pipeline only: image uploads through /api/v1/image/upload and triggers AI ingestion.</p>
                              <input id="mobileUploadCameraInput" type="file" accept="image/*,.jpg,.jpeg,.png,.heic,.heif" capture="environment" class="hidden" />
                              <input id="mobileUploadFileInput" type="file" accept="image/*,.jpg,.jpeg,.png,.heic,.heif" class="hidden" />
                              <div class="mobile-upload-actions mb-3">
                                  <button id="mobileUploadCameraBtn" class="px-3 py-2 rounded-lg bg-sky-600/10 border border-sky-600/20 text-xs text-sky-800 font-bold hover:bg-sky-600/20 transition-all">
                                      <i class="fa fa-camera mr-1"></i><span data-i18n="mobile_camera">Camera</span>
                                  </button>
                                  <button id="mobileUploadAlbumBtn" class="px-3 py-2 rounded-lg bg-amber-600/10 border border-amber-600/20 text-xs text-amber-900 font-bold hover:bg-amber-600/20 transition-all">
                                      <i class="fa fa-image mr-1"></i><span data-i18n="mobile_album">Album</span>
                                  </button>
                                  <button id="mobileUploadClearBtn" class="px-3 py-2 rounded-lg bg-rose-600/10 border border-rose-600/20 text-xs text-rose-800 font-bold hover:bg-rose-600/20 transition-all" data-i18n="mobile_clear">Clear</button>
                                  <button id="mobileUploadSubmitBtn" class="px-3 py-2 rounded-lg bg-emerald-600 border border-emerald-700 text-xs text-white font-bold shadow-md hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all" disabled data-i18n="mobile_upload">Upload</button>
                              </div>
                              <p id="mobileUploadFileName" class="text-[11px] text-[#332b21]/80 mb-3 font-mono truncate" data-i18n="no_image_selected">No image selected</p>
                              <div class="mb-3">
                                  <button id="mobileLivePocBtn"
                                     onclick="window.openLiveCameraModal()"
                                     class="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-violet-600/10 border border-violet-600/20 text-xs text-violet-800 font-bold hover:bg-violet-600/20 transition-all">
                                      <i class="fa fa-video-camera"></i>
                                      <span data-i18n="mobile_live_poc">Live Camera PoC</span>
                                  </button>
                                  <span class="ml-2 text-[10px] text-[#332b21]/60" data-i18n="mobile_live_poc_desc">Open real-time camera frame upload page</span>
                              </div>
                              <div class="aspect-video bg-black/40 rounded-xl overflow-hidden border border-white/10 relative mb-3">
                                  <img id="mobileUploadPreview" src="" alt="preview" class="hidden w-full h-full object-cover" />
                                  <div id="mobileUploadPreviewEmpty" class="absolute inset-0 flex items-center justify-center text-slate-500 text-xs" data-i18n="waiting_image">Waiting image...</div>
                              </div>
                              <div class="w-full bg-[#332b21]/10 rounded-full h-1.5 overflow-hidden border border-[#332b21]/10">
                                  <div id="mobileUploadProgressBar" class="h-full bg-emerald-400 transition-all" style="width:0%"></div>
                              </div>
                              <div class="flex items-center justify-between mt-2">
                                  <p id="mobileUploadStatus" class="text-[11px] text-[#332b21] font-bold" data-i18n="upload_ready">等待上传。</p>
                                  <span id="mobileUploadProgressText" class="text-[10px] text-emerald-800 font-black font-mono">0%</span>
                              </div>
                          </div>

                          <div class="glass-panel p-6 flex flex-col">
                              <h2 class="text-sm font-bold text-[#332b21] mb-6 flex items-center gap-2 uppercase tracking-widest"><i class="fa fa-microchip text-rose-600"></i><span data-i18n="ai_feedback">AI 推理结果</span></h2>
                              <div id="aiDiagnosisContainer" class="diagnosis-scroll flex-1 space-y-4 overflow-y-auto max-h-[360px] pr-2">
                                  <!-- Diagnosis Cards -->
                              </div>
                          </div>
                      </div>
  
  <!-- Modal for Base Skill Preview (Simplified) -->
  <div id="aiSkillModal" class="fixed inset-0 z-[100] bg-slate-900/90 backdrop-blur-md flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300">
      <div class="glass-panel max-w-2xl w-full mx-4 shadow-[0_0_50px_rgba(16,185,129,0.2)] border border-emerald-500/30 overflow-hidden transform scale-95 transition-transform duration-300" id="aiSkillModalContent">
          <div class="flex justify-between items-center p-6 border-b border-white/10 bg-black/20">
              <h3 class="text-sm font-bold text-white tracking-widest uppercase">AI-ag Agent Skill 核心协议</h3>
              <button onclick="UI.AI.hideSkillPreview()" class="text-slate-400 hover:text-white transition-colors w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center"><i class="fa fa-times"></i></button>
          </div>
          <div class="p-8 bg-black/40 max-h-[70vh] overflow-y-auto" id="aiSkillMarkdown"></div>
      </div>
  </div>

  <!-- Modal for Image Preview -->
  <div id="imageModal" class="fixed inset-0 z-[100] bg-slate-900/90 backdrop-blur-md flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300">
      <div class="glass-panel max-w-4xl w-full mx-4 shadow-[0_0_50px_rgba(16,185,129,0.3)] border border-emerald-500/30 overflow-hidden transform scale-95 transition-transform duration-300" id="modalContent">
          <div class="flex justify-between items-center p-4 border-b border-white/10 bg-black/20">
              <h3 id="modalCaption" class="text-lg font-bold text-emerald-400 tracking-wider flex items-center gap-2"><i class="fa fa-camera-retro"></i><span>图传预览</span></h3>
              <button onclick="closeModal()" class="text-slate-400 hover:text-white transition-colors w-8 h-8 rounded-lg bg-white/5 hover:bg-rose-500/20"><i class="fa fa-times"></i></button>
          </div>
          <div class="p-4 bg-black/40 text-center">
              <img id="modalImage" src="" alt="image preview" class="max-w-full h-auto mx-auto rounded-xl shadow-2xl" />
          </div>
      </div>
  </div>

  <!-- Live Camera Modal -->
  <div id="liveCameraModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-8 opacity-0 pointer-events-none transition-opacity duration-300 backdrop-blur-md bg-black/60">
      <div class="glass-panel w-full max-w-5xl h-[85vh] flex flex-col relative overflow-hidden shadow-2xl">
          <div class="flex items-center justify-between p-4 border-b border-[#332b21]/10 bg-[#fcf5e5]">
              <h3 class="text-lg font-bold text-[#332b21] flex items-center gap-2"><i class="fa fa-video-camera text-violet-600"></i><span data-i18n="mobile_live_poc">Live Camera PoC</span></h3>
              <button onclick="window.closeLiveCameraModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-[#332b21]/5 text-[#332b21]/60 hover:bg-rose-500 hover:text-white transition-colors">
                  <i class="fa fa-times"></i>
              </button>
          </div>
          <div class="flex-1 w-full bg-[#081426]">
              <iframe id="liveCameraIframe" src="" class="w-full h-full border-none" allow="camera"></iframe>
          </div>
      </div>
  </div>

  <script src="i18n.js?v=1.1"></script>
  <script src="runtime-config.js"></script>
  <script src="api.js?v=1.1"></script>
  <script src="ui.js?v=1.1"></script>
  <script src="chat.js?v=1.1"></script>
  <script src="app.js?v=1.2"></script>
</body>
</html>
